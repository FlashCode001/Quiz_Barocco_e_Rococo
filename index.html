<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz: Barocco e Rococò</title>
  <style>
    /* Reset e Stili Generali */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f4f0;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Contenitore Principale */
    .quiz-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 650px;
    }

    /* Intestazione */
    .quiz-header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eaeaea;
    }

    .quiz-header h1 {
      font-family: 'Georgia', serif;
      color: #2c3e50;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .quiz-header p {
      color: #7f8c8d;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Testo Introduttivo */
    .intro-text {
      text-align: center;
      color: #4a5568;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    /* Domanda */
    #question {
      font-family: 'Georgia', serif;
      font-size: 20px;
      color: #2c3e50;
      margin-bottom: 25px;
      line-height: 1.4;
      text-align: center;
    }

    /* Pulsanti delle Risposte e d'Azione */
    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      background-color: #ffffff;
      border: 2px solid #e2e8f0;
      color: #4a5568;
      border-radius: 8px;
      padding: 16px 20px;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .btn:hover:not(:disabled) {
      border-color: #cda434;
      background-color: #fcfbf7;
      color: #2c3e50;
    }

    .btn:disabled {
      cursor: not-allowed;
    }

    /* Stati Risposta */
    .btn.correct {
      background-color: #f0fdf4;
      border-color: #22c55e;
      color: #166534;
    }

    .btn.wrong {
      background-color: #fef2f2;
      border-color: #ef4444;
      color: #991b1b;
    }

    /* Box Spiegazione Errore */
    #explanation-box {
      margin-top: 25px;
      padding: 16px 20px;
      background-color: #fffbeb;
      border-left: 4px solid #f59e0b;
      border-radius: 0 8px 8px 0;
      font-size: 15px;
      line-height: 1.5;
      color: #92400e;
      display: none;
      animation: fadeIn 0.4s ease;
    }

    #explanation-box strong {
      display: block;
      margin-bottom: 5px;
      color: #b45309;
    }

    /* Pulsanti di Controllo */
    .action-btn {
      margin-top: 25px;
      width: 100%;
      background-color: #2c3e50;
      color: white;
      border: none;
      padding: 16px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      font-weight: bold;
    }

    .action-btn:hover {
      background-color: #1a252f;
    }

    .restart-btn {
      background-color: #cda434;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      margin-top: 20px;
    }

    .restart-btn:hover {
      background-color: #b38f2d;
    }

    /* Schermata Risultati */
    #score-container {
      text-align: center;
    }

    #score-container h2 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      color: #2c3e50;
      margin-bottom: 15px;
    }

    #score-container p {
      font-size: 18px;
      color: #4a5568;
    }

    .hide {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    
    <!-- Schermata di Inizio -->
    <div id="start-screen">
      <div class="quiz-header">
        <h1>Quiz di Storia dell'Arte</h1>
        <p>Barocco e Rococò</p>
      </div>
      <p class="intro-text">
        Metti alla prova le tue conoscenze sulle sculture di <strong>Gian Lorenzo Bernini</strong> ed <strong>Edmé Bouchardon</strong>, e sul grande affresco di <strong>Pietro da Cortona</strong>.
      </p>
      <button class="action-btn" onclick="initQuiz()">Avvia Quiz</button>
    </div>

    <!-- Schermata Domande -->
    <div id="quiz-screen" class="hide">
      <div class="quiz-header">
        <h1 id="artwork-author">Autore</h1>
        <p id="artwork-title">Titolo dell'opera</p>
      </div>

      <h2 id="question">Caricamento domanda...</h2>
      <div id="answer-buttons" class="btn-grid">
        <!-- Generati dinamici via JS -->
      </div>

      <div id="explanation-box" class="hide">
        <strong>Spiegazione:</strong>
        <span id="explanation-text"></span>
      </div>

      <button id="next-btn" class="action-btn hide">Domanda Successiva</button>
    </div>

    <!-- Schermata Risultati -->
    <div id="score-container" class="hide">
      <h2>Quiz Completato!</h2>
      <p id="score-text"></p>
      <button class="restart-btn" onclick="resetToStart()">Ricomincia dall'Inizio</button>
    </div>

  </div>

  <script>
    const questions = [
      // 1. GIAN LORENZO BERNINI - Il Ratto di Proserpina
      {
        author: "Gian Lorenzo Bernini",
        title: "Il Ratto di Proserpina (1621-1622)",
        question: "Cosa scatena sulla Terra il rapimento di Proserpina da parte del dio degli Inferi Plutone?",
        answers: [
          { text: "La dea Cere smette di far crescere la vegetazione, rischiando di causare una carestia.", correct: true },
          { text: "Cerbero abbandona l'Oltretomba scatenando il panico tra gli umani.", correct: false, explanation: "La slide indica che Cerbero resta ai piedi delle figure a guardia dell'Oltretomba, mentre è la dea Cere a bloccare la vegetazione." },
          { text: "Plutone viene immediatamente punito e costretto a restituire la giovane senza accordi.", correct: false, explanation: "Il testo della slide spiega che per evitare la carestia viene trovato un accordo: Proserpina passerà sei mesi negli Inferi e sei mesi con la madre." },
          { text: "Proserpina viene trasformata in un albero per essere salvata dalla madre.", correct: false, explanation: "Secondo le slide, viene raggiunto un accordo temporale: sei mesi negli Inferi con Plutone e sei mesi sulla Terra con la madre Cere." }
        ]
      },
      {
        author: "Gian Lorenzo Bernini",
        title: "Il Ratto di Proserpina (1621-1622)",
        question: "Quale momento sceglie di scolpire Bernini e come è strutturata l'opera?",
        answers: [
          { text: "Scolpisce l'apice della storia, racchiudendo le figure in una struttura a spirale che spinge a ruotare attorno all'opera.", correct: true },
          { text: "Rappresenta una scena statica in cui Proserpina raccoglie fiori in tranquillità.", correct: false, explanation: "La slide specifica che Bernini non sceglie un momento qualsiasi, ma l'apice della storia mentre Proserpina cerca disperatamente di liberarsi." },
          { text: "Organizza la scultura su un unico piano frontale privo di morbidezza.", correct: false, explanation: "I personaggi sono racchiusi in una struttura a spirale per invitare lo spettatore a ruotare attorno alla statua, e il marmo mostra una morbidezza incredibile." },
          { text: "Rappresenta l'accordo pacifico raggiunto tra la dea Cere e Plutone.", correct: false, explanation: "Bernini scolpisce l'apice drammatico del rapimento, dove le dita di Plutone sembrano affondare nel corpo di Proserpina." }
        ]
      },

      // 2. EDMÉ BOUCHARDON - Cupido che fabbrica il suo arco
      {
        author: "Edmé Bouchardon",
        title: "Cupido che fabbrica il suo arco (1750)",
        question: "Cosa utilizza Cupido per fabbricare il suo arco e qual è il significato allegorico?",
        answers: [
          { text: "Usa la clava del forte Ercole, a significare che l'amore supera persino la forza maggiore.", correct: true },
          { text: "Usa un ramo d'alloro per indicare il trionfo della gloria poetica.", correct: false, explanation: "La slide riporta espressamente che Cupido usa la clava del forte Ercole per simboleggiare la vittoria dell'amore sulla forza." },
          { text: "Usa un fulmine sottratto a Giove per mostrare la sua potenza divina.", correct: false, explanation: "Il testo specifica che sta fabbricando l'arco usando la clava di Ercole." },
          { text: "Usa una spada spezzata per simboleggiare la fine di ogni guerra.", correct: false, explanation: "L'attrezzo impiegato da Cupido è la clava del forte Ercole." }
        ]
      },
      {
        author: "Edmé Bouchardon",
        title: "Cupido che fabbrica il suo arco (1750)",
        question: "Quale espressione e resa formale caratterizzano questa scultura rococò?",
        answers: [
          { text: "Superfici lisce ed eleganti con un viso sereno e un leggero sorriso furbetto, in contrasto col dramma barocco.", correct: true },
          { text: "Una forte espressività drammatica e un volto contorto dal dolore.", correct: false, explanation: "La slide evidenzia un viso sereno con un leggero sorriso furbetto, ponendolo in contrasto con la violenza del barocco." },
          { text: "Una muscolatura contratta in tensione estrema per lo sforzo fisico.", correct: false, explanation: "Le superfici sono lisce ed eleganti, pensate per ricreare un senso di grazia, armonia e movimento morbido." },
          { text: "Un volto severo e privo di emozioni per sottolineare la solitudine del personaggio.", correct: false, explanation: "Il testo della slide parla esplicitamente di un 'viso sereno e un leggero sorriso furbetto'." }
        ]
      },

      // 3. PIETRO DA CORTONA - Il Trionfo della Divina Provvidenza
      {
        author: "Pietro da Cortona",
        title: "Il Trionfo della Divina Provvidenza (1632-1639)",
        question: "Quale tecnica prospettica utilizza Pietro da Cortona per superare i limiti dell'architettura reale?",
        answers: [
          { text: "Lo sfondamento prospettico illusionistico (quadratura).", correct: true },
          { text: "La suddivisione in quadri riportati, separando nettamente le scene.", correct: false, explanation: "Pietro da Cortona supera la suddivisione in quadri riportati creando una finta architettura dipinta che si apre verso il cielo." },
          { text: "L'uso di sfondi scuri privi di fonti luminose aperte.", correct: false, explanation: "L'opera è caratterizzata da una luce calda e dorata e da un'apertura verso un cielo infinito." },
          { text: "La prospettiva lineare a punto di fuga unico centrale sul pavimento.", correct: false, explanation: "Cortona utilizza uno sfondamento prospettico con finta architettura in stucco dipinto che simula l'apertura della volta." }
        ]
      },
      {
        author: "Pietro da Cortona",
        title: "Il Trionfo della Divina Provvidenza (1632-1639)",
        question: "Cosa sorreggono le Virtù Teologali al centro della volta, incoronato dall'Immortalità?",
        answers: [
          { text: "Lo scudo papale di Urbano VIII Barberini con le tre api dorate.", correct: true },
          { text: "Un busto celebrativo raffigurante Gian Lorenzo Bernini.", correct: false, explanation: "L'affresco glorifica il papato di Urbano VIII Barberini, il cui stemma reca tre api dorate." },
          { text: "La clava di Ercole e le armi conquistate ai Giganti.", correct: false, explanation: "Al centro è raffigurato lo stemma della famiglia Barberini con le tre api cinto da alloro." },
          { text: "Una rappresentazione allegorica dell'Oltretomba.", correct: false, explanation: "L'elemento centrale è lo stemma con le tre api dorate sorretto dalle Virtù Teologali." }
        ]
      },
      {
        author: "Pietro da Cortona",
        title: "Il Trionfo della Divina Provvidenza (1632-1639)",
        question: "Nel riquadro del 'Trionfo della Religione e Sapienza', quali figure vengono scacciate?",
        answers: [
          { text: "Il Sileno ebbro e la Lascivia.", correct: true },
          { text: "I Giganti sbaragliati da Minerva.", correct: false, explanation: "I Giganti sono combattuti da Minerva in un altro settore per simboleggiare la sconfitta dell'eresia." },
          { text: "Il Furore incatenato sopra un mucchio d'armi.", correct: false, explanation: "Il Furore viene incatenato nel settore del 'Trionfo della Pace'." },
          { text: "Le Arpie scacciate dalla clava di Ercole.", correct: false, explanation: "Le Arpie vengono affrontate da Ercole nel scomparto dedicato alla virtù eroica." }
        ]
      }
    ];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const scoreContainer = document.getElementById("score-container");

    const authorElement = document.getElementById("artwork-author");
    const titleElement = document.getElementById("artwork-title");
    const questionElement = document.getElementById("question");
    const answerButtonsElement = document.getElementById("answer-buttons");
    const nextButton = document.getElementById("next-btn");
    const explanationBox = document.getElementById("explanation-box");
    const explanationText = document.getElementById("explanation-text");
    const scoreText = document.getElementById("score-text");

    let currentQuestionIndex = 0;
    let score = 0;

    function initQuiz() {
      startScreen.classList.add("hide");
      scoreContainer.classList.add("hide");
      quizScreen.classList.remove("hide");
      currentQuestionIndex = 0;
      score = 0;
      showQuestion();
    }

    function showQuestion() {
      resetState();
      let currentQuestion = questions[currentQuestionIndex];
      
      authorElement.innerText = currentQuestion.author;
      titleElement.innerText = currentQuestion.title;
      questionElement.innerText = currentQuestion.question;

      currentQuestion.answers.forEach(answer => {
        const button = document.createElement("button");
        button.innerText = answer.text;
        button.classList.add("btn");
        if (answer.correct) {
          button.dataset.correct = answer.correct;
        }
        if (answer.explanation) {
          button.dataset.explanation = answer.explanation;
        }
        button.addEventListener("click", selectAnswer);
        answerButtonsElement.appendChild(button);
      });
    }

    function resetState() {
      nextButton.classList.add("hide");
      explanationBox.classList.add("hide");
      while (answerButtonsElement.firstChild) {
        answerButtonsElement.removeChild(answerButtonsElement.firstChild);
      }
    }

    function selectAnswer(e) {
      const selectedButton = e.target;
      const isCorrect = selectedButton.dataset.correct === "true";

      Array.from(answerButtonsElement.children).forEach(button => {
        button.disabled = true;
        if (button.dataset.correct === "true") {
          button.classList.add("correct");
        }
      });

      if (isCorrect) {
        score++;
      } else {
        selectedButton.classList.add("wrong");
        explanationText.innerText = selectedButton.dataset.explanation;
        explanationBox.classList.remove("hide");
      }

      nextButton.classList.remove("hide");
      
      if (questions.length === currentQuestionIndex + 1) {
        nextButton.innerText = "Mostra Risultati";
      } else {
        nextButton.innerText = "Domanda Successiva";
      }
    }

    function showScore() {
      quizScreen.classList.add("hide");
      scoreContainer.classList.remove("hide");
      scoreText.innerHTML = `Hai risposto correttamente a <strong>${score}</strong> domande su <strong>${questions.length}</strong>.`;
    }

    function resetToStart() {
      scoreContainer.classList.add("hide");
      quizScreen.classList.add("hide");
      startScreen.classList.remove("hide");
    }

    nextButton.addEventListener("click", () => {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        showScore();
      }
    });
  </script>
</body>
</html>
